[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-agent"
version = "0.1.0"
description = "Medallion lakehouse on Databricks with a tool-using agent and an LLM evaluation harness"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5,<4", "sqlglot>=25", "pandas>=2", "numpy", "scikit-learn", "mlflow-skinny>=2.14", "sqlalchemy", "alembic"]

[project.optional-dependencies]
databricks = ["delta-spark>=3.2", "openai>=1.30", "databricks-vectorsearch"]
dev = ["pytest>=8", "pyyaml>=6", "python-hcl2>=7"]

[project.scripts]
lh-seed = "lakehouse_agent.data.synth:main"
lh-pipeline = "lakehouse_agent.pipeline.run:main"
lh-eval = "lakehouse_agent.evals.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
